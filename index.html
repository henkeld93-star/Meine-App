<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- TAB LEISTE -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="openTab('todo-tab', this)">To-Do</button>
            <button class="tab-btn" onclick="openTab('kalender-tab', this)">Kalender</button>
            <button class="tab-btn" onclick="openTab('gym-tab', this)">GYM</button>
            <button class="tab-btn" onclick="openTab('journal-tab', this)">Journal</button>
        </div>

        <!-- 1. TO-DO TAB -->
        <div id="todo-tab" class="tab-content active">
            <h2>To-Do Liste</h2>
            <div class="input-container">
                <input type="text" id="todo-input" placeholder="Neue Aufgabe...">
                <button onclick="addTodo()">+</button>
            </div>
            <ul id="todo-list"></ul>
        </div>

        <!-- 2. KALENDER TAB -->
        <div id="kalender-tab" class="tab-content">
            <h2>Kalender</h2>
            <div class="calendar-header">
                <button onclick="prevMonth()">❮</button>
                <h3 id="month-year-display">Monat Jahr</h3>
                <button onclick="nextMonth()">❯</button>
            </div>
            <div class="calendar-weekdays">
                <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div>
                <div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div id="calendar-days" class="calendar-days-grid"></div>

            <div class="event-section">
                <h4 id="selected-day-label">Klicke einen Tag an</h4>
                <div class="input-container">
                    <input type="text" id="event-title" placeholder="Neuer Termin...">
                    <button onclick="addEvent()">+</button>
                </div>
                <ul id="event-list"></ul>
            </div>
        </div>

       <!-- 3. GYM TAB -->
        <div id="gym-tab" class="tab-content">
            <h2>Gym Planer</h2>
            <button id="workout-toggle-btn" class="workout-btn start" onclick="toggleWorkout()">Workout Starten 🏋️</button>
            
            <div id="workout-timer" style="display: none; text-align: center; margin: 15px 0;">
                <span id="timer-display" style="font-size: 28px; font-weight: bold; color: #007bff;">00:00</span>
            </div>

            <div class="gym-input-group">
                <select id="exercise-select" style="width: 100%; margin-bottom: 10px;">
                    <option value="Beinpresse">Beinpresse</option>
    <option value="Brustpresse">Brustpresse</option>
    <option value="Beinbeuger">Beinbeuger</option>
    <option value="Beinstrecker">Beinstrecker</option>
    <option value="Schulterpresse">Schulterpresse</option>
    <option value="Latzug">Latzug</option>
    <option value="Bizepscurl">Bizepscurl</option>
    <option value="Crunches Maschine">Crunches Maschine</option>
    <option value="Rückenstrecker">Rückenstrecker</option>
    <option value="Wadenheben">Wadenheben</option>
                </select>
                
                <!-- Hier stehen kg, Wdh und + perfekt nebeneinander -->
                <div class="gym-row">
                    <input type="number" id="gym-weight" placeholder="kg">
                    <input type="number" id="gym-reps" placeholder="Wdh">
                    <button onclick="addGymSet()">+</button>
                </div>
            </div>
            <ul id="gym-log-list" style="margin-top: 15px;"></ul>
        </div>

        <!-- 4. JOURNAL TAB -->
        <div id="journal-tab" class="tab-content">
            <h2>Tagebuch & Journal</h2>
            <input type="date" id="journal-date" style="width: 100%; margin-bottom: 10px; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 6px;">
            
            <div class="mood-selector" style="display: flex; gap: 8px; margin-bottom: 15px;">
                <button class="mood-btn" onclick="selectMood('😃', this)">😃</button>
                <button class="mood-btn" onclick="selectMood('😐', this)">😐</button>
                <button class="mood-btn" onclick="selectMood('😔', this)">😔</button>
                <button class="mood-btn" onclick="selectMood('🔥', this)">🔥</button>
            </div>

            <textarea id="journal-notes" placeholder="Gedanken & Notizen..." rows="3" style="width: 100%; margin-bottom: 8px; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 6px;"></textarea>
            <textarea id="journal-grateful" placeholder="Wofür bist du heute dankbar?" rows="2" style="width: 100%; margin-bottom: 8px; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 6px;"></textarea>
            <textarea id="journal-goals" placeholder="Ziele für morgen..." rows="2" style="width: 100%; margin-bottom: 10px; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 6px;"></textarea>
            
            <button onclick="saveJournalEntry()" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold;">Eintrag Speichern 📝</button>

            <div id="journal-entries-container" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
